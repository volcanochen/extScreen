<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 720" width="1400" height="720" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif">
  <defs>
    <marker id="g" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#059669"/></marker>
    <marker id="b" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#2563eb"/></marker>
    <marker id="r" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#dc2626"/></marker>
    <marker id="k" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#4b5563"/></marker>
  </defs>
  <rect x="0" y="0" width="1400" height="720" fill="#f8fafc"/>
  <text x="36" y="42" font-size="24" font-weight="700" fill="#0f172a">窗口投屏：多路会话与数据流</text>
  <text x="36" y="68" font-size="14" fill="#64748b">一路流 = 多台手机同时观看；多个窗口 = 多路独立会话（端口 / mDNS / 手机记忆各自独立）</text>

  <!-- 左：窗口 -->
  <rect x="30" y="92" width="300" height="360" rx="14" fill="#eef2ff" stroke="#a5b4fc" stroke-width="2"/>
  <text x="48" y="120" font-size="15" font-weight="700" fill="#3730a3">Windows：被投窗口</text>
  <rect x="48" y="136" width="264" height="76" rx="8" fill="#ffffff" stroke="#818cf8"/>
  <text x="62" y="160" font-size="13" font-weight="700" fill="#312e81">窗口 A（任务管理器）</text>
  <text x="62" y="182" font-size="11" fill="#64748b">PrintWindow + PW_RENDERFULLCONTENT</text>
  <text x="62" y="200" font-size="11" fill="#64748b">能抓被遮挡 / 后台窗口</text>
  <rect x="48" y="240" width="264" height="76" rx="8" fill="#ffffff" stroke="#818cf8"/>
  <text x="62" y="264" font-size="13" font-weight="700" fill="#312e81">窗口 B（资源管理器）</text>
  <text x="62" y="286" font-size="11" fill="#64748b">最小化时先 SW_RESTORE 再抓</text>
  <text x="62" y="304" font-size="11" fill="#64748b">真边界取 DWM 扩展边框（不含阴影）</text>
  <rect x="48" y="340" width="264" height="92" rx="8" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="62" y="364" font-size="12" font-weight="700" fill="#92400e">CastManager.acquire(hwnd)</text>
  <text x="62" y="386" font-size="11" fill="#92400e">同窗口再投 → 复用会话不重启</text>
  <text x="62" y="406" font-size="11" fill="#92400e">（重启会踢掉已连的手机）</text>

  <!-- 中左：会话 -->
  <rect x="350" y="92" width="290" height="360" rx="14" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/>
  <text x="368" y="120" font-size="15" font-weight="700" fill="#047857">CastMonitor（每路一个）</text>
  <rect x="368" y="136" width="254" height="76" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
  <text x="380" y="160" font-size="13" font-weight="700" fill="#047857">会话 1 → :8123</text>
  <text x="380" y="182" font-size="11" fill="#475569">抓帧线程 → JPEG 1080px / 20fps</text>
  <text x="380" y="200" font-size="11" fill="#475569">独立 mDNS 实例（随机后缀）</text>
  <rect x="368" y="240" width="254" height="76" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
  <text x="380" y="264" font-size="13" font-weight="700" fill="#047857">会话 2 → :8124</text>
  <text x="380" y="286" font-size="11" fill="#475569">端口占用自动顺延；连接前先探测</text>
  <text x="380" y="304" font-size="11" fill="#475569">SO_REUSEADDR 双绑假成功踩过坑</text>
  <rect x="368" y="340" width="254" height="92" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="380" y="364" font-size="12" font-weight="700" fill="#334155">每路独立记忆</text>
  <text x="380" y="386" font-size="11" fill="#475569">launched_serials：本路拉起过的手机</text>
  <text x="380" y="406" font-size="11" fill="#475569">停该路 → 只恢复它自己的手机</text>

  <path d="M312 174 H364" stroke="#4b5563" stroke-width="2" marker-end="url(#k)"/>
  <path d="M312 278 H364" stroke="#4b5563" stroke-width="2" marker-end="url(#k)"/>

  <!-- 中右：协议通道 -->
  <rect x="660" y="92" width="190" height="360" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="678" y="120" font-size="15" font-weight="700" fill="#334155">协议通道</text>
  <g font-size="11">
    <rect x="676" y="136" width="158" height="48" rx="8" fill="#d1fae5" stroke="#34d399"/>
    <text x="688" y="156" font-size="12" font-weight="700" fill="#047857">→ MJPEG /stream</text>
    <text x="688" y="174" font-size="11" fill="#065f46">multipart/x-mixed-replace</text>
    <rect x="676" y="200" width="158" height="48" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="688" y="220" font-size="12" font-weight="700" fill="#334155">→ mDNS 组播</text>
    <text x="688" y="238" font-size="11" fill="#475569">PTR / SRV / TXT / A</text>
    <rect x="676" y="264" width="158" height="48" rx="8" fill="#ecfdf5" stroke="#34d399"/>
    <text x="688" y="284" font-size="12" font-weight="700" fill="#047857">← adb reverse</text>
    <text x="688" y="302" font-size="11" fill="#065f46">USB 回环，断网可投</text>
    <rect x="676" y="328" width="158" height="48" rx="8" fill="#fee2e2" stroke="#f87171"/>
    <text x="688" y="348" font-size="12" font-weight="700" fill="#b91c1c">← /touch · /device</text>
    <text x="688" y="366" font-size="11" fill="#991b1b">XHR POST（Chrome 74）</text>
    <rect x="676" y="392" width="158" height="42" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="688" y="410" font-size="11" fill="#475569">停止 → force-stop</text>
    <text x="688" y="427" font-size="11" fill="#475569">+ reverse --remove-all</text>
  </g>
  <path d="M622 174 H676" stroke="#059669" stroke-width="2.5" marker-end="url(#g)"/>
  <path d="M622 278 H676" stroke="#059669" stroke-width="2.5" marker-end="url(#g)"/>

  <!-- 右：手机 -->
  <rect x="870" y="92" width="500" height="360" rx="14" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/>
  <text x="888" y="120" font-size="15" font-weight="700" fill="#047857">手机：粘滞会话（pin）</text>
  <rect x="888" y="136" width="222" height="76" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
  <text x="900" y="160" font-size="13" font-weight="700" fill="#047857">手机 1 · Galaxy S22 Ultra</text>
  <text x="900" y="182" font-size="11" fill="#475569">pin = 127.0.0.1:8123</text>
  <text x="900" y="200" font-size="11" fill="#475569">看会话 1 的画面</text>
  <rect x="1126" y="136" width="222" height="76" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
  <text x="1138" y="160" font-size="13" font-weight="700" fill="#047857">手机 2 · Galaxy Note8</text>
  <text x="1138" y="182" font-size="11" fill="#475569">pin = 127.0.0.1:8124</text>
  <text x="1138" y="200" font-size="11" fill="#475569">看会话 2 的画面</text>

  <rect x="888" y="228" width="460" height="66" rx="8" fill="#fee2e2" stroke="#f87171"/>
  <text x="902" y="252" font-size="12" font-weight="700" fill="#b91c1c">粘滞规则：发现新服务时先验 pin 是否存活</text>
  <text x="902" y="274" font-size="11" fill="#7f1d1d">活着 → 无视新发现（防抢台）　｜　死了 → 拉黑 5min 并转投活服务</text>

  <rect x="888" y="306" width="460" height="126" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="902" y="330" font-size="12" font-weight="700" fill="#334155">USB 回环：adb reverse tcp:PORT tcp:PORT</text>
  <text x="902" y="352" font-size="11" fill="#475569">debug_url = http://127.0.0.1:PORT/ → 手机不开 WiFi 也能投</text>
  <text x="902" y="374" font-size="11" fill="#475569">拔线 → 接收器健康检查失败 → 自动退回 WiFi / mDNS 发现</text>
  <text x="902" y="396" font-size="11" fill="#475569">同一路流可有多台观众；适配只按首台设备，后来者不挪窗口</text>
  <text x="902" y="418" font-size="11" fill="#475569">同设备旋转（宽高互换）才跟随调整，保面积只调一边</text>

  <path d="M834 174 H884" stroke="#059669" stroke-width="2.5" marker-end="url(#g)"/>
  <path d="M834 278 H884" stroke="#059669" stroke-width="2.5" marker-end="url(#g)"/>

  <!-- 底部：回传与清理 -->
  <rect x="30" y="470" width="1340" height="220" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="48" y="498" font-size="16" font-weight="700" fill="#334155">回传与清理（全部入口走同一条状态跳变路径）</text>

  <rect x="48" y="514" width="410" height="64" rx="8" fill="#fee2e2" stroke="#f87171"/>
  <text x="62" y="536" font-size="12" font-weight="700" fill="#b91c1c">触摸 → 鼠标（只作用于被投窗口）</text>
  <text x="62" y="558" font-size="11" fill="#7f1d1d">归一化 → 子窗口命中 → PostMessage WM_LBUTTON*</text>

  <rect x="478" y="514" width="410" height="64" rx="8" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="492" y="536" font-size="12" font-weight="700" fill="#1d4ed8">屏幕信息 → 窗口比例</text>
  <text x="492" y="558" font-size="11" fill="#1e3a8a">POST /device → 只按首台设备 fit（保面积调一边）</text>

  <rect x="908" y="514" width="440" height="64" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="922" y="536" font-size="12" font-weight="700" fill="#334155">停止某一路 → 只清它的手机</text>
  <text x="922" y="558" font-size="11" fill="#475569">am force-stop + reverse --remove-all → 恢复原界面</text>

  <!-- 三张卡片并列呈现，流向由 TECHNICAL.md 的时序图表达，避免长斜线压正文 -->

  <text x="48" y="612" font-size="12" fill="#475569">清理触发：poll_loop 检测 CastMonitor 的 run→停 跳变；覆盖托盘菜单 / 标题栏按钮 / 系统菜单 / 出错自停</text>
  <text x="48" y="636" font-size="12" fill="#475569">只清理本程序拉起的手机；用户手动打开的接收器不受打扰；已拔线的自然跳过</text>
  <text x="48" y="660" font-size="12" fill="#475569">契约测试锁死：98 checks（含粘滞会话 / 多观众不挪窗口 / 端口兜底优先 mon）+ 多路 e2e 11/11</text>
</svg>
